[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparsetune"
version = "0.1.11"
description = "Cross-backend sparse linear solver auto-tuner"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
# Upper bounds cap at the next untested major release (NumPy 2.x / SciPy 1.x
# are the versions this solver is validated against) so a breaking major
# release doesn't silently install and change solver behavior at runtime.
dependencies = [
    "numpy>=1.24.0,<3",
    "scipy>=1.10.0,<2",
]

[project.urls]
Repository = "https://github.com/takurot/sparse-tune"
Issues = "https://github.com/takurot/sparse-tune/issues"

[project.scripts]
sparsetune = "sparsetune._cli:main"

[project.optional-dependencies]
cuda12 = ["cupy-cuda12x<14"]
cuda13 = ["cupy-cuda13x<14"]
test = [
    "coverage>=7.10",
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "gpu: requires a compatible CUDA GPU",
]

[tool.coverage.run]
source = ["sparsetune"]
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
exclude = ["docs/SPEC.md"]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
