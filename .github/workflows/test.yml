name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  minimum-dependencies:
    name: Minimum dependencies / Python 3.10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "numpy==1.24.0" "scipy==1.10.0" "pytest>=7.0"
      - run: python -m pip install --no-deps -e .
      - run: >-
          python -c "import numpy as np;
          from scipy.sparse import csr_matrix;
          from sparsetune import solve, SolveStatus;
          result = solve(csr_matrix([[4.0, 1.0], [1.0, 3.0]]),
          backend='scipy:cpu');
          assert result.status is SolveStatus.CONVERGED;
          np.testing.assert_allclose(result.x, [1.0, 1.0])"
      - run: python -m pytest -m "not gpu"

  cpu:
    name: CPU / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]" ruff
      - run: coverage erase
      - run: coverage run -m pytest -m "not gpu"
      - run: coverage combine
      - run: coverage report
      - run: ruff check .
      - run: ruff format --check .

  distribution:
    name: Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: 'python -m venv "${RUNNER_TEMP}/wheel-venv"'
      - run: '"${RUNNER_TEMP}/wheel-venv/bin/python" -m pip install dist/*.whl'
      - run: '"${RUNNER_TEMP}/wheel-venv/bin/sparsetune" --version'
      - run: '"${RUNNER_TEMP}/wheel-venv/bin/python" -m pip check'
