name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    name: CPU / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]" ruff
      - run: coverage erase
      - run: coverage run -m pytest -m "not gpu"
      - run: coverage combine
      - run: coverage report
      - run: ruff check .
      - run: ruff format --check .

  distribution:
    name: Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: 'python -m venv "${RUNNER_TEMP}/wheel-venv"'
      - run: '"${RUNNER_TEMP}/wheel-venv/bin/python" -m pip install dist/*.whl'
      - run: '"${RUNNER_TEMP}/wheel-venv/bin/sparsetune" --version'
      - run: '"${RUNNER_TEMP}/wheel-venv/bin/python" -m pip check'
