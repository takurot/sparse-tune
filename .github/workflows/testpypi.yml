name: Publish to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Bounds build, OIDC upload, and the TestPyPI installation smoke check.
    timeout-minutes: 20
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - id: package
        run: |
          version="$(python scripts/artifact_version.py dist/*)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - run: 'python -m venv "${RUNNER_TEMP}/testpypi-venv"'
      - run: '"${RUNNER_TEMP}/testpypi-venv/bin/python" -m pip install numpy scipy'
      - run: >-
          "${RUNNER_TEMP}/testpypi-venv/bin/python" -m pip install
          --index-url https://test.pypi.org/simple/
          --no-deps
          "sparsetune==${VERSION}"
        env:
          VERSION: ${{ steps.package.outputs.version }}
      - run: '"${RUNNER_TEMP}/testpypi-venv/bin/sparsetune" --version'
      - run: '"${RUNNER_TEMP}/testpypi-venv/bin/python" -m pip check'
