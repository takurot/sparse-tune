name: Publish to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - id: package
        run: |
          version="$(python scripts/artifact_version.py dist/*)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - run: 'python -m venv "${RUNNER_TEMP}/testpypi-venv"'
      - run: '"${RUNNER_TEMP}/testpypi-venv/bin/python" -m pip install numpy scipy'
      - run: >-
          "${RUNNER_TEMP}/testpypi-venv/bin/python" -m pip install
          --index-url https://test.pypi.org/simple/
          --no-deps
          "sparsetune==${VERSION}"
        env:
          VERSION: ${{ steps.package.outputs.version }}
      - run: '"${RUNNER_TEMP}/testpypi-venv/bin/sparsetune" --version'
      - run: '"${RUNNER_TEMP}/testpypi-venv/bin/python" -m pip check'
